services:

  postgres:
    image: postgres:15-alpine
    container_name: demand_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demand_planning
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - demand_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demand_planning"]
      interval: 10s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    container_name: demand_falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "3003:3000"
    volumes:
      - falkordb_data:/data
    networks:
      - demand_network

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: demand_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - demand_network

  redpanda_console:
    image: redpandadata/console:latest
    container_name: demand_redpanda_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      - redpanda
    networks:
      - demand_network

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: demand_temporal
    environment:
      - DB=postgres12
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - demand_network

  temporal_ui:
    image: temporalio/ui:2.26.2
    container_name: demand_temporal_ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal
    networks:
      - demand_network

  fastapi:
    build: .
    container_name: demand_fastapi
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/demand_planning
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - demand_network

  inngest:
    image: inngest/inngest:latest
    container_name: demand_inngest
    command: "inngest dev --host 0.0.0.0 -u http://fastapi:8000/api/inngest"
    ports:
      - "8288:8288"
    depends_on:
      - fastapi
    networks:
      - demand_network

  temporal_worker:
    build: .
    container_name: demand_temporal_worker
    command: ["python", "-m", "app.temporal.worker"]
    env_file: .env
    depends_on:
      - temporal
    networks:
      - demand_network

  gmail_poller:
    build: .
    container_name: demand_gmail_poller
    command: ["python", "run_pipeline_service.py"]
    env_file: .env
    volumes:
      - ./attachments:/app/attachments
    depends_on:
      - fastapi
    networks:
      - demand_network

  # ✅ FIXED METABASE
  metabase:
    image: metabase/metabase:latest
    container_name: demand_metabase
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - demand_network

networks:
  demand_network:
    driver: bridge

volumes:
  postgres_data:
  falkordb_data:
  redpanda_data:
  metabase_data: